<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preset Winners Wheel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    /* Top Indicator Arrow */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .controls {
      background: #2d2d44;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    textarea, input {
      width: 90%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e2e;
      color: #fff;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #2ed573;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #26af5f;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #ffa502;
    }
  </style>
</head>
<body>

  <h2>Spin Wheel (Pre-set Winner Control)</h2>

  <div class="container">
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="controls">
      <label for="teams">Wheel Teams (Comma separated):</label>
      <textarea id="teams" rows="3">Team A, Team B, Team C, Team D, Team E, Team F</textarea>

      <label for="preset">🎯 Pre-set Winners Sequence (Order):</label>
      <input type="text" id="preset" placeholder="Team B, Team D, Team A">
      <small style="color: #aaa; font-size: 11px;">Spins will land strictly in this order.</small>

      <button id="spinBtn" onclick="spinWheel()">SPIN WHEEL 🎯</button>
      <div id="result"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    
    let currentRotation = 0;
    let isSpinning = false;
    let presetQueue = [];
    
    const colors = ["#ff6b6b", "#4ecdc4", "#ffe66d", "#1dd1a1", "#54a0ff", "#5f27cd", "#ff9ff3"];

    function getTeams() {
      return document.getElementById("teams").value.split(",").map(t => t.trim()).filter(t => t);
    }

    function drawWheel() {
      const teams = getTeams();
      const numSlices = teams.length;
      if (numSlices === 0) return;

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.stroke();

        // Draw Team Labels
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Arial";
        ctx.fillText(teams[i], radius - 20, 5);
        ctx.restore();
      }
    }

    // Load presets when changed
    function updatePresets() {
      const presetInput = document.getElementById("preset").value;
      presetQueue = presetInput.split(",").map(s => s.trim()).filter(s => s);
    }

    document.getElementById("preset").addEventListener("change", updatePresets);
    document.getElementById("teams").addEventListener("input", drawWheel);

    function spinWheel() {
      if (isSpinning) return;

      const teams = getTeams();
      if (teams.length < 2) {
        alert("At least 2 teams required!");
        return;
      }

      updatePresets();

      let targetIndex = -1;

      // Check if preset queue has an item
      if (presetQueue.length > 0) {
        const targetTeam = presetQueue.shift(); // Pick first in queue
        // Update input box to show remaining
        document.getElementById("preset").value = presetQueue.join(", ");
        
        targetIndex = teams.findIndex(t => t.toLowerCase() === targetTeam.toLowerCase());
      }

      // If no valid preset target found, pick random
      if (targetIndex === -1) {
        targetIndex = Math.floor(Math.random() * teams.length);
      }

      // Calculate Target Angle
      const sliceDeg = 360 / teams.length;
      const targetMidDeg = (targetIndex + 0.5) * sliceDeg;
      
      // Top position is 270 degrees in standard coordinate canvas
      let targetRotation = 270 - targetMidDeg;
      if (targetRotation < 0) targetRotation += 360;

      // Add full spin turns (e.g. 5 spins = 1800 deg)
      const totalDegrees = 360 * 5 + targetRotation;
      
      // Ensure smooth continuous rotation accumulate
      const finalAngle = currentRotation + (totalDegrees - (currentRotation % 360));

      isSpinning = true;
      document.getElementById("result").innerText = "Spinning...";

      // CSS Transition for spinning animation
      canvas.style.transition = "transform 4s cubic-bezier(0.15, 0.9, 0.25, 1)";
      canvas.style.transform = `rotate(${finalAngle}deg)`;

      currentRotation = finalAngle;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById("result").innerText = `🎉 Winner: ${teams[targetIndex]}!`;
      }, 4000);
    }

    // Initial Render
    drawWheel();
  </script>
</body>
</html>
