<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAHJA-26 | Executive Team Selector</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090a0f 0%, #121824 100%);
      --accent-color: #d4af37;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(212, 175, 55, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: var(--bg-gradient);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .fest-title {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #fff 30%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .fest-subtitle {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .admin-toggle-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .admin-toggle-btn:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 1200px;
    }

    .wheel-container {
      position: relative;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
    }

    .pointer {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid var(--accent-color);
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
    }

    canvas {
      border-radius: 50%;
      display: block;
    }

    .spin-trigger-btn {
      margin-top: 20px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      color: #000;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 16px 45px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .spin-trigger-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
    }

    /* Committee Drawer */
    .committee-panel {
      display: none;
      width: 100%;
      max-width: 900px;
      background: rgba(15, 20, 30, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      margin-top: 20px;
    }

    .panel-header {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-item {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 120px;
      gap: 15px;
      align-items: center;
      background: rgba(255,255,255,0.02);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .team-item input[type="text"] {
      background: #090a0f;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .theme-selector {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .theme-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.2);
    }

    /* Winner Popup */
    .winner-modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .winner-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(18, 24, 36, 0.95) 100%);
      border: 2px solid var(--accent-color);
      border-radius: 24px;
      padding: 50px 70px;
      text-align: center;
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.3);
      max-width: 500px;
      width: 90%;
    }

    .winner-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 20px auto;
      display: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    .winner-title {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      color: #fff;
      margin: 15px 0;
    }

    .close-modal-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 10px 30px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .close-modal-btn:hover {
      background: var(--accent-color);
      color: #000;
    }
  </style>
</head>
<body>

  <button class="admin-toggle-btn" onclick="toggleCommitteePortal()">🔒 COMMITTEE PORTAL</button>

  <header>
    <h1 class="fest-title">BAHJA-26</h1>
    <p class="fest-subtitle">DARS Students Art Fest | Executive Selection</p>
  </header>

  <div class="main-wrapper">
    <!-- Public Phase: Wheel Section -->
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="460" height="460"></canvas>
    </div>

    <button class="spin-trigger-btn" onclick="spin()">SPIN WHEEL</button>

    <!-- Committee Phase: Protected Settings -->
    <div class="committee-panel" id="committeePanel">
      <div class="panel-header">
        <span>Committee Control Panel</span>
        <span style="font-size: 0.8rem; color: #9ca3af;">Protected Mode</span>
      </div>

      <div id="teamsControlList"></div>

      <div style="margin-top: 25px;">
        <h4 style="color: var(--accent-color); margin-bottom: 10px;">Executive Color Themes</h4>
        <div class="theme-selector">
          <div class="theme-btn" style="background: #d4af37;" onclick="setTheme('gold')"></div>
          <div class="theme-btn" style="background: #00e5ff;" onclick="setTheme('cyan')"></div>
          <div class="theme-btn" style="background: #ff0055;" onclick="setTheme('crimson')"></div>
          <div class="theme-btn" style="background: #10b981;" onclick="setTheme('emerald')"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="winner-modal" id="winnerModal">
    <div class="winner-card">
      <p style="color: var(--accent-color); letter-spacing: 3px; font-size: 0.85rem; text-transform: uppercase;">Selected Team</p>
      <img id="winnerLogo" class="winner-logo" src="" alt="Team Logo" />
      <h2 class="winner-title" id="winnerName">TEAM NAME</h2>
      <button class="close-modal-btn" onclick="closeModal()">CONFIRM</button>
    </div>
  </div>

  <script>
    // Executive Default Teams Dataset
    let teamsData = [
      { id: 1, name: "ESPERENZA", color: "#d4af37", enabled: true, logo: "" },
      { id: 2, name: "LUMINOSA", color: "#1e293b", enabled: true, logo: "" },
      { id: 3, name: "GLORIOSA", color: "#475569", enabled: true, logo: "" },
      { id: 4, name: "VITORIA", color: "#0f172a", enabled: true, logo: "" },
      { id: 5, name: "VALERIA", color: "#334155", enabled: true, logo: "" }
    ];

    let isCommitteeUnlocked = false;
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    
    let startAngle = 0;
    let arc = 0;
    let spinTimeout = null;
    let spinAngleStart = 10;
    let spinTime = 0;
    let spinTimeTotal = 0;
    let lastAngleIndex = -1;

    // Executive Web Audio API Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playVictoryChime() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const notes = [261.63, 329.63, 392.00, 523.25]; // C Major Chord
      
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        
        gain.gain.setValueAtTime(0, now + index * 0.08);
        gain.gain.linearRampToValueAtTime(0.2, now + index * 0.08 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 1.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.08);
        osc.stop(now + index * 0.08 + 1.2);
      });
    }

    function getActiveTeams() {
      return teamsData.filter(t => t.enabled && t.name.trim() !== "");
    }

    function drawWheel() {
      const activeTeams = getActiveTeams();
      if (activeTeams.length === 0) {
        ctx.clearRect(0, 0, 460, 460);
        return;
      }

      arc = Math.PI / (activeTeams.length / 2);
      ctx.clearRect(0, 0, 460, 460);

      const outsideRadius = 210;
      const textRadius = 145;
      const insideRadius = 55;

      for (let i = 0; i < activeTeams.length; i++) {
        const angle = startAngle + i * arc;
        
        // Premium Dark Alternating Palettes
        ctx.fillStyle = (i % 2 === 0) ? '#121824' : '#1a2332';

        ctx.beginPath();
        ctx.arc(230, 230, outsideRadius, angle, angle + arc, false);
        ctx.arc(230, 230, insideRadius, angle + arc, angle, true);
        ctx.strokeStyle = "rgba(212, 175, 55, 0.3)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fill();

        ctx.save();
        ctx.fillStyle = "#d4af37";
        ctx.font = "600 15px 'Plus Jakarta Sans', sans-serif";
        ctx.translate(230 + Math.cos(angle + arc / 2) * textRadius, 
                      230 + Math.sin(angle + arc / 2) * textRadius);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = activeTeams[i].name;
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
      }
    }

    function rotateWheel() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
      }
      const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
      startAngle += (spinAngle * Math.PI / 180);
      drawWheel();

      const activeTeams = getActiveTeams();
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const currentIdx = Math.floor((360 - degrees % 360) / arcd) % activeTeams.length;
      
      if (currentIdx !== lastAngleIndex) {
        playTickSound();
        lastAngleIndex = currentIdx;
      }

      spinTimeout = setTimeout(rotateWheel, 30);
    }

    function stopRotateWheel() {
      clearTimeout(spinTimeout);
      const activeTeams = getActiveTeams();
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - degrees % 360) / arcd);
      
      const winner = activeTeams[(index + activeTeams.length) % activeTeams.length];
      
      document.getElementById('winnerName').innerText = winner.name;
      const logoImg = document.getElementById('winnerLogo');
      if (winner.logo) {
        logoImg.src = winner.logo;
        logoImg.style.display = 'block';
      } else {
        logoImg.style.display = 'none';
      }

      document.getElementById('winnerModal').style.display = 'flex';
      playVictoryChime();

      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#d4af37', '#ffffff', '#aa7c11']
      });
    }

    function easeOut(t, b, c, d) {
      const ts = (t /= d) * t;
      const tc = ts * t;
      return b + c * (tc + -3 * ts + 3 * t);
    }

    function spin() {
      const activeTeams = getActiveTeams();
      if (activeTeams.length < 2) {
        alert("At least 2 active teams required!");
        return;
      }
      spinAngleStart = Math.random() * 10 + 12;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 4000;
      rotateWheel();
    }

    function closeModal() {
      document.getElementById('winnerModal').style.display = 'none';
    }

    /* Committee Controls */
    function toggleCommitteePortal() {
      if (!isCommitteeUnlocked) {
        const pass = prompt("Enter Committee Password:");
        if (pass === "spincommittiee") {
          isCommitteeUnlocked = true;
          document.getElementById('committeePanel').style.display = 'block';
          renderCommitteeList();
        } else if (pass !== null) {
          alert("Incorrect Password!");
        }
      } else {
        const panel = document.getElementById('committeePanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      }
    }

    function renderCommitteeList() {
      const container = document.getElementById('teamsControlList');
      container.innerHTML = '';

      teamsData.forEach((team, idx) => {
        const row = document.createElement('div');
        row.className = 'team-item';
        row.innerHTML = `
          <input type="checkbox" ${team.enabled ? 'checked' : ''} onchange="toggleTeam(${team.id})">
          <input type="text" value="${team.name}" oninput="updateTeamName(${team.id}, this.value)">
          <input type="file" accept="image/png, image/jpeg" onchange="uploadLogo(${team.id}, event)">
          <span style="font-size: 0.75rem; color: #9ca3af;">${team.logo ? 'Logo Added' : 'No Logo'}</span>
        `;
        container.appendChild(row);
      });
    }

    function toggleTeam(id) {
      const team = teamsData.find(t => t.id === id);
      if (team) team.enabled = !team.enabled;
      drawWheel();
    }

    function updateTeamName(id, val) {
      const team = teamsData.find(t => t.id === id);
      if (team) team.name = val;
      drawWheel();
    }

    function uploadLogo(id, event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const team = teamsData.find(t => t.id === id);
          if (team) team.logo = e.target.result;
          renderCommitteeList();
        };
        reader.readAsDataURL(file);
      }
    }

    function setTheme(theme) {
      const root = document.documentElement;
      if (theme === 'gold') {
        root.style.setProperty('--accent-color', '#d4af37');
        root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #090a0f 0%, #121824 100%)');
      } else if (theme === 'cyan') {
        root.style.setProperty('--accent-color', '#00e5ff');
        root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #031016 0%, #08202d 100%)');
      } else if (theme === 'crimson') {
        root.style.setProperty('--accent-color', '#ff0055');
        root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #120309 0%, #240813 100%)');
      } else if (theme === 'emerald') {
        root.style.setProperty('--accent-color', '#10b981');
        root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #02120d 0%, #07261c 100%)');
      }
      drawWheel();
    }

    drawWheel();
  </script>
</body>
</html>
