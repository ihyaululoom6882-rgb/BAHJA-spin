<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAHJA-26 | Executive Selection Portal</title>
  <!-- Premium Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Great+Vibes&family=Montserrat:wght@600;800&family=Orbitron:wght@700;900&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090a0f 0%, #121824 100%);
      --accent-color: #d4af37;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(212, 175, 55, 0.25);
      --fest-font: 'Cinzel', serif;
      --team-font: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-gradient);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Top Bar Header */
    header { text-align: center; margin-bottom: 25px; }

    .fest-title {
      font-family: var(--fest-font);
      font-size: 3.2rem;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #ffffff 30%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 25px rgba(0,0,0,0.8);
      transition: font-family 0.3s ease;
    }

    .fest-subtitle {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .admin-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .admin-toggle-btn:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    /* Wheel Section */
    .wheel-container {
      position: relative;
      padding: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
    }

    .pointer {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid var(--accent-color);
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
    }

    canvas { border-radius: 50%; display: block; }

    .spin-trigger-btn {
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      color: #000;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 3px;
      padding: 16px 50px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .spin-trigger-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
    }

    /* Committee Control Panel */
    .committee-panel {
      display: none;
      width: 100%;
      max-width: 1000px;
      background: rgba(12, 16, 26, 0.96);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      margin-top: 20px;
    }

    .panel-header {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .control-group {
      background: rgba(255, 255, 255, 0.02);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--accent-color);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .control-group input[type="text"], .control-group select {
      width: 100%;
      background: #080b12;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .team-item {
      display: grid;
      grid-template-columns: 35px 1.2fr 50px 1fr 100px;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,0.02);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .team-item input[type="color"] {
      width: 100%;
      height: 35px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .team-item input[type="text"] {
      background: #080b12;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Winner Popup */
    .winner-modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(15px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .winner-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(18, 24, 36, 0.95) 100%);
      border: 2px solid var(--accent-color);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.35);
      max-width: 500px;
      width: 90%;
    }

    .winner-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 15px auto;
      display: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    }

    .winner-title {
      font-family: var(--team-font);
      font-size: 2.8rem;
      color: #fff;
      margin: 15px 0;
    }

    .close-modal-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 10px 30px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
    }

    .close-modal-btn:hover {
      background: var(--accent-color);
      color: #000;
    }
  </style>
</head>
<body>

  <button class="admin-toggle-btn" onclick="toggleCommitteePortal()">🔒 COMMITTEE PORTAL</button>

  <header>
    <h1 class="fest-title" id="displayFestName">BAHJA-26</h1>
    <p class="fest-subtitle">DARS Students Art Fest</p>
  </header>

  <div class="main-wrapper">
    <!-- Public Wheel Section -->
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="460" height="460"></canvas>
    </div>

    <button class="spin-trigger-btn" onclick="spin()">SPIN WHEEL</button>

    <!-- Committee Panel -->
    <div class="committee-panel" id="committeePanel">
      <div class="panel-header">
        <span>Committee Control Portal</span>
        <span style="font-size: 0.8rem; color: #9ca3af;">Access Granted</span>
      </div>

      <div class="panel-grid">
        <!-- General Settings -->
        <div class="control-group">
          <label>Fest Name</label>
          <input type="text" id="inputFestName" value="BAHJA-26" oninput="updateFestName(this.value)">
        </div>

        <div class="control-group">
          <label>Fest Name Font</label>
          <select onchange="changeFestFont(this.value)">
            <option value="'Cinzel', serif">Cinzel (Executive Classical)</option>
            <option value="'Orbitron', sans-serif">Orbitron (Modern Neon)</option>
            <option value="'Great Vibes', cursive">Great Vibes (Calligraphy)</option>
            <option value="'Playfair Display', serif">Playfair (Royal Serif)</option>
            <option value="'Montserrat', sans-serif">Montserrat (Clean Modern)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Wheel Team Font</label>
          <select onchange="changeTeamFont(this.value)">
            <option value="'Plus Jakarta Sans', sans-serif">Jakarta Sans (Clean)</option>
            <option value="'Orbitron', sans-serif">Orbitron (Futuristic)</option>
            <option value="'Montserrat', sans-serif">Montserrat (Bold)</option>
            <option value="'Cinzel', serif">Cinzel (Classical)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Center Logo (PNG)</label>
          <input type="file" accept="image/png, image/jpeg" onchange="uploadCenterLogo(event)">
        </div>

        <div class="control-group">
          <label>Winner Announcement Custom Audio</label>
          <input type="file" accept="audio/*" onchange="uploadCustomAudio(event)">
        </div>

        <div class="control-group" style="display: flex; align-items: center; height: 100%;">
          <label class="checkbox-container">
            <input type="checkbox" id="autoRemoveToggle" checked>
            <span>Auto-Remove Selected Team After Spin</span>
          </label>
        </div>
      </div>

      <h4 style="color: var(--accent-color); margin-bottom: 12px;">Team Settings (Color, Name, Logo, Active Status)</h4>
      <div id="teamsControlList"></div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="winner-modal" id="winnerModal">
    <div class="winner-card">
      <p style="color: var(--accent-color); letter-spacing: 3px; font-size: 0.85rem; text-transform: uppercase;">Selected Team</p>
      <img id="winnerLogo" class="winner-logo" src="" alt="Team Logo" />
      <h2 class="winner-title" id="winnerName">TEAM NAME</h2>
      <button class="close-modal-btn" onclick="closeModal()">CONFIRM & CONTINUE</button>
    </div>
  </div>

  <script>
    // Initial Teams Dataset
    let teamsData = [
      { id: 1, name: "ESPERENZA", color: "#1e293b", enabled: true, logo: "" },
      { id: 2, name: "LUMINOSA", color: "#334155", enabled: true, logo: "" },
      { id: 3, name: "GLORIOSA", color: "#0f172a", enabled: true, logo: "" },
      { id: 4, name: "VITORIA", color: "#172554", enabled: true, logo: "" },
      { id: 5, name: "VALERIA", color: "#311b92", enabled: true, logo: "" }
    ];

    let isCommitteeUnlocked = false;
    let autoRemoveSelected = true;
    let centerLogoImg = new Image();
    let hasCenterLogo = false;
    let customAudioURL = null;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    
    let startAngle = 0;
    let arc = 0;
    let spinTimeout = null;
    let spinAngleStart = 10;
    let spinTime = 0;
    let spinTimeTotal = 0;
    let lastAngleIndex = -1;
    let currentWinnerId = null;

    // Web Audio Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playVictoryAudio() {
      if (customAudioURL) {
        const audio = new Audio(customAudioURL);
        audio.play();
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25];
        
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0, now + index * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, now + index * 0.08 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 1.2);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 1.2);
        });
      }
    }

    function getActiveTeams() {
      return teamsData.filter(t => t.enabled && t.name.trim() !== "");
    }

    function drawWheel() {
      const activeTeams = getActiveTeams();
      ctx.clearRect(0, 0, 460, 460);

      if (activeTeams.length === 0) return;

      arc = Math.PI / (activeTeams.length / 2);
      const outsideRadius = 210;
      const textRadius = 140;
      const insideRadius = 55;

      for (let i = 0; i < activeTeams.length; i++) {
        const angle = startAngle + i * arc;
        
        ctx.fillStyle = activeTeams[i].color;

        ctx.beginPath();
        ctx.arc(230, 230, outsideRadius, angle, angle + arc, false);
        ctx.arc(230, 230, insideRadius, angle + arc, angle, true);
        ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fill();

        ctx.save();
        ctx.fillStyle = "#d4af37";
        const teamFontFamily = getComputedStyle(document.documentElement).getPropertyValue('--team-font');
        ctx.font = `700 15px ${teamFontFamily}`;
        ctx.translate(230 + Math.cos(angle + arc / 2) * textRadius, 
                      230 + Math.sin(angle + arc / 2) * textRadius);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = activeTeams[i].name;
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
      }

      // Draw Center PNG / Cap
      ctx.save();
      ctx.beginPath();
      ctx.arc(230, 230, insideRadius, 0, Math.PI * 2);
      ctx.fillStyle = "#090a0f";
      ctx.fill();
      ctx.strokeStyle = "rgba(212, 175, 55, 0.8)";
      ctx.lineWidth = 3;
      ctx.stroke();

      if (hasCenterLogo) {
        ctx.clip();
        ctx.drawImage(centerLogoImg, 230 - insideRadius, 230 - insideRadius, insideRadius * 2, insideRadius * 2);
      }
      ctx.restore();
    }

    function rotateWheel() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
      }
      const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
      startAngle += (spinAngle * Math.PI / 180);
      drawWheel();

      const activeTeams = getActiveTeams();
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const currentIdx = Math.floor((360 - degrees % 360) / arcd) % activeTeams.length;
      
      if (currentIdx !== lastAngleIndex) {
        playTickSound();
        lastAngleIndex = currentIdx;
      }

      spinTimeout = setTimeout(rotateWheel, 30);
    }

    function stopRotateWheel() {
      clearTimeout(spinTimeout);
      const activeTeams = getActiveTeams();
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - degrees % 360) / arcd);
      
      const winner = activeTeams[(index + activeTeams.length) % activeTeams.length];
      currentWinnerId = winner.id;

      document.getElementById('winnerName').innerText = winner.name;
      const logoImg = document.getElementById('winnerLogo');
      if (winner.logo) {
        logoImg.src = winner.logo;
        logoImg.style.display = 'block';
      } else {
        logoImg.style.display = 'none';
      }

      document.getElementById('winnerModal').style.display = 'flex';
      
      playVictoryAudio();

      // Golden Popper Effect
      confetti({
        particleCount: 130,
        spread: 90,
        origin: { y: 0.6 },
        colors: ['#d4af37', '#ffffff', '#aa7c11', '#ff0055']
      });
    }

    function easeOut(t, b, c, d) {
      const ts = (t /= d) * t;
      const tc = ts * t;
      return b + c * (tc + -3 * ts + 3 * t);
    }

    function spin() {
      const activeTeams = getActiveTeams();
      if (activeTeams.length < 1) {
        alert("No active teams left to spin!");
        return;
      }
      spinAngleStart = Math.random() * 10 + 12;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 4000;
      rotateWheel();
    }

    function closeModal() {
      document.getElementById('winnerModal').style.display = 'none';
      
      // Auto Remove Winner Team Option
      const shouldRemove = document.getElementById('autoRemoveToggle').checked;
      if (shouldRemove && currentWinnerId !== null) {
        const team = teamsData.find(t => t.id === currentWinnerId);
        if (team) team.enabled = false;
        if (isCommitteeUnlocked) renderCommitteeList();
        drawWheel();
      }
    }

    /* Committee Controls Functions */
    function toggleCommitteePortal() {
      if (!isCommitteeUnlocked) {
        const pass = prompt("Enter Committee Password:");
        if (pass === "spincommittiee") {
          isCommitteeUnlocked = true;
          document.getElementById('committeePanel').style.display = 'block';
          renderCommitteeList();
        } else if (pass !== null) {
          alert("Incorrect Password!");
        }
      } else {
        const panel = document.getElementById('committeePanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      }
    }

    function renderCommitteeList() {
      const container = document.getElementById('teamsControlList');
      container.innerHTML = '';

      teamsData.forEach((team) => {
        const row = document.createElement('div');
        row.className = 'team-item';
        row.innerHTML = `
          <input type="checkbox" ${team.enabled ? 'checked' : ''} onchange="toggleTeam(${team.id})">
          <input type="text" value="${team.name}" oninput="updateTeamName(${team.id}, this.value)">
          <input type="color" value="${team.color}" onchange="updateTeamColor(${team.id}, this.value)">
          <input type="file" accept="image/png, image/jpeg" onchange="uploadLogo(${team.id}, event)">
          <span style="font-size: 0.75rem; color: #9ca3af;">${team.logo ? 'Logo Added' : 'No Logo'}</span>
        `;
        container.appendChild(row);
      });
    }

    function toggleTeam(id) {
      const team = teamsData.find(t => t.id === id);
      if (team) team.enabled = !team.enabled;
      drawWheel();
    }

    function updateTeamName(id, val) {
      const team = teamsData.find(t => t.id === id);
      if (team) team.name = val;
      drawWheel();
    }

    function updateTeamColor(id, color) {
      const team = teamsData.find(t => t.id === id);
      if (team) team.color = color;
      drawWheel();
    }

    function uploadLogo(id, event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const team = teamsData.find(t => t.id === id);
          if (team) team.logo = e.target.result;
          renderCommitteeList();
        };
        reader.readAsDataURL(file);
      }
    }

    function uploadCenterLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          centerLogoImg.src = e.target.result;
          centerLogoImg.onload = function() {
            hasCenterLogo = true;
            drawWheel();
          };
        };
        reader.readAsDataURL(file);
      }
    }

    function uploadCustomAudio(event) {
      const file = event.target.files[0];
      if (file) {
        customAudioURL = URL.createObjectURL(file);
      }
    }

    function updateFestName(val) {
      document.getElementById('displayFestName').innerText = val || 'ART FEST';
    }

    function changeFestFont(font) {
      document.documentElement.style.setProperty('--fest-font', font);
    }

    function changeTeamFont(font) {
      document.documentElement.style.setProperty('--team-font', font);
      drawWheel();
    }

    drawWheel();
  </script>
</body>
</html>
